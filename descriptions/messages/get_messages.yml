Historique des messages (paginé)
---
tags:
  - Messages
security:
  - BearerAuth: []
parameters:
  - name: conversation_id
    in: path
    type: string
    required: true
    description: ID de la conversation
  - name: limit
    in: query
    type: integer
    description: Nombre de messages à récupérer
    default: 50
  - name: before_id
    in: query
    type: string
    description: ID du message précédent (pour pagination)
responses:
  200:
    description: Liste des messages
    schema:
      type: array
      items:
        type: object
        properties:
          _id:
            type: string
          conversation_id:
            type: string
          sender_id:
            type: string
          type:
            type: string
          content:
            type: string
          timestamp:
            type: string
            format: date-time
            description: Date d'envoi au format ISO 8601 UTC (suffixe Z)
          reply_to_id:
            type: string
            description: ID du message auquel cette réponse se rapporte
          is_deleted:
            type: boolean
            description: Indique si le message a été supprimé pour tous
          deleted_at:
            type: string
            format: date-time
            description: Date de suppression pour tous au format ISO 8601 UTC
          deleted_by:
            type: string
            description: ID de l'utilisateur ayant supprimé le message pour tous
          read_by:
            type: array
          reactions:
            type: array
  403:
    description: Non autorisé