Transfère un message vers d'autres conversations
---
tags:
  - Messages
security:
  - BearerAuth: []
parameters:
  - name: conversation_id
    in: path
    type: string
    required: true
    description: ID de la conversation source
  - name: message_id
    in: path
    type: string
    required: true
    description: ID du message à transférer
  - name: body
    in: body
    required: true
    schema:
      type: object
      required:
        - conversation_ids
      properties:
        conversation_ids:
          type: array
          items:
            type: string
          description: Liste des IDs des conversations cibles
responses:
  200:
    description: Messages transférés
  403:
    description: Non autorisé
  404:
    description: Message non trouvé