Ajoute une réaction à un message
---
tags:
  - Messages
security:
  - BearerAuth: []
parameters:
  - name: conversation_id
    in: path
    type: string
    required: true
    description: ID de la conversation
  - name: message_id
    in: path
    type: string
    required: true
    description: ID du message
  - name: body
    in: body
    required: true
    schema:
      type: object
      required:
        - reaction
      properties:
        reaction:
          type: string
          description: Émoji ou texte de réaction
          example: "👍"
responses:
  200:
    description: Réaction ajoutée
  403:
    description: Non autorisé
  404:
    description: Message non trouvé