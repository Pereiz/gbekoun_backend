Recherche des utilisateurs
- Numéro complet (ex. +22991000001, avec ou sans « + ») : correspondance exacte,
  `phone_number` renvoyé (vous le connaissez déjà).
- Sinon, recherche par nom ou pseudo : `phone_number` n'est PAS renvoyé, seulement
  `phone_masked` (ex. +229••••••01) pour distinguer deux homonymes.
  Utiliser `id` pour démarrer une conversation (POST /api/conversations/direct avec user_id).
- Un morceau de numéro ne donne aucun résultat. Les utilisateurs bloqués (dans un
  sens ou dans l'autre) n'apparaissent pas.
---
tags:
  - Utilisateurs
security:
  - BearerAuth: []
parameters:
  - name: q
    in: query
    type: string
    required: true
    description: Nom, pseudo ou numéro complet (minimum 2 caractères)
  - name: limit
    in: query
    type: integer
    default: 20
    description: 50 maximum
responses:
  200:
    description: Résultats de la recherche
    schema:
      type: array
      items:
        type: object
        properties:
          id: {type: string}
          display_name: {type: string, example: "Koffi"}
          username: {type: string, example: "koffi"}
          avatar_url: {type: string}
          is_online: {type: boolean}
          phone_masked: {type: string, example: "+229••••••01"}
          phone_number: {type: string, description: "Uniquement pour une recherche par numéro complet"}
  400:
    description: QUERY_TOO_SHORT
