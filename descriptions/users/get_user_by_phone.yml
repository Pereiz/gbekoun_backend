Récupère un utilisateur par numéro de téléphone complet
Correspondance exacte uniquement (avec ou sans « + »).
---
tags:
  - Utilisateurs
security:
  - BearerAuth: []
parameters:
  - name: phone_number
    in: path
    type: string
    required: true
    example: "+22991000001"
responses:
  200:
    description: Détails de l'utilisateur
  400:
    description: INVALID_PHONE (pas un numéro complet)
  404:
    description: USER_NOT_FOUND
