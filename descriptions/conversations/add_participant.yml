Ajoute un participant au groupe
---
tags:
  - Conversations
security:
  - BearerAuth: []
parameters:
  - name: conversation_id
    in: path
    type: string
    required: true
    description: ID de la conversation
  - name: body
    in: body
    required: true
    schema:
      type: object
      description: "Indiquer user_id OU phone_number"
      properties:
        user_id:
          type: string
          description: Id du participant à ajouter
        phone_number:
          type: string
          description: Numéro de téléphone du participant à ajouter
responses:
  200:
    description: Participant ajouté
  401:
    description: Non authentifié
  403:
    description: Non autorisé (admin requis)
  404:
    description: Utilisateur ou conversation non trouvé