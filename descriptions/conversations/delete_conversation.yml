Supprime une conversation pour soi (soft delete)
L'historique est effacé pour soi seul. Discussion directe : elle réapparaît (vide) au
prochain message. Groupe : équivaut à le quitter, avec la même succession de l'admin
que /leave (`promoted_user_id` dans la réponse).
---
tags:
  - Conversations
security:
  - BearerAuth: []
parameters:
  - name: conversation_id
    in: path
    type: string
    required: true
    description: ID de la conversation
responses:
  200:
    description: Conversation supprimée
  401:
    description: Non authentifié
  403:
    description: Non autorisé
  404:
    description: Conversation non trouvée