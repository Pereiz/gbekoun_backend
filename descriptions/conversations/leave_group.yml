Quitte un groupe
Si c'est le dernier admin, le membre le plus ancien devient admin automatiquement :
la réponse contient `promoted_user_id` et les membres reçoivent `participant_left`
puis `admin_changed` (reason = last_admin_left).
---
tags:
  - Conversations
security:
  - BearerAuth: []
parameters:
  - name: id
    in: path
    type: string
    required: true
    description: ID de la conversation
responses:
  200:
    description: Groupe quitté
  401:
    description: Non authentifié
  403:
    description: Non autorisé (admin ne peut pas quitter sans transférer)
  404:
    description: Conversation non trouvée