Liste des participants d'une conversation
---
tags:
  - Conversations
security:
  - BearerAuth: []
parameters:
  - name: conversation_id
    in: path
    type: string
    required: true
    description: ID de la conversation
responses:
  200:
    description: Liste des participants
    schema:
      type: array
      items:
        type: object
        properties:
          id:
            type: string
          display_name:
            type: string
          avatar_url:
            type: string
          is_online:
            type: boolean
          is_admin:
            type: boolean
  401:
    description: Non authentifié
  403:
    description: Non autorisé
  404:
    description: Conversation non trouvée