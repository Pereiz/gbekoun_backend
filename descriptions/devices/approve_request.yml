Autoriser le nouvel appareil (appelé par l'appareil ACTIF)
Le nouvel appareil devient l'appareil du compte. L'appareil qui approuve est révoqué :
son token ne fonctionne plus et ses sockets sont fermés juste après la réponse.
L'appli doit alors afficher « Compte transféré sur un autre appareil ».
---
tags:
  - Appareils
parameters:
  - name: request_id
    in: path
    type: string
    required: true
responses:
  200:
    description: Décision enregistrée
    schema:
      type: object
      properties:
        request_id: {type: string}
        status: {type: string, example: approved}
  404:
    description: REQUEST_NOT_FOUND
  409:
    description: REQUEST_NOT_PENDING (déjà traitée ou expirée)
