Autoriser le nouvel appareil (appelé par le TÉLÉPHONE actif, jamais par un PC)
kind = mobile : le nouveau téléphone devient l'appareil du compte et le téléphone qui approuve est révoqué :
son token ne fonctionne plus et ses sockets sont fermés juste après la réponse.
L'appli doit alors afficher « Compte transféré sur un autre appareil ».
kind = web : le PC obtient une session d'administration de 1 h ; le téléphone reste connecté.
---
tags:
  - Appareils
parameters:
  - name: request_id
    in: path
    type: string
    required: true
responses:
  200:
    description: Décision enregistrée
    schema:
      type: object
      properties:
        request_id: {type: string}
        status: {type: string, example: approved}
  403:
    description: MOBILE_REQUIRED (appelé depuis un PC)
  404:
    description: REQUEST_NOT_FOUND
  409:
    description: REQUEST_NOT_PENDING (déjà traitée ou expirée)
