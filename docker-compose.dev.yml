# =============================================================
# GBEKOUN - DÉVELOPPEMENT
#
#   cp .env.example .env      # puis remplir les mots de passe
#   docker compose -f docker-compose.dev.yml up --build
#
# - le code est monté dans le conteneur : toute modification recharge l'API ;
# - Swagger disponible sur http://localhost:8880/apidocs/ ;
# - bases accessibles depuis la machine : PostgreSQL localhost:5435, MongoDB localhost:27020.
# Aucun secret ici : tout vient du fichier .env (non versionné).
# Pour la production : docker-compose.prod.yml.
# =============================================================

services:
  api:
    build: .
    image: gbekoun-api:dev
    container_name: gbekoun_dev_api
    restart: unless-stopped
    env_file: ${ENV_FILE:-.env}
    environment:
      FLASK_DEBUG: "1"
      # Dans le réseau Docker, les bases sont joignables par leur nom de service.
      PG_HOST: postgres
      PG_PORT: "5432"
      # Comptes à droits limités (voir database/postgres/app_user.sql et database/mongo/init.js) :
      # l'API ne peut ni modifier le schéma ni toucher aux autres bases.
      PG_USER: ${PG_APP_USER:?PG_APP_USER requis}
      PG_PASSWORD: ${PG_APP_PASSWORD:?PG_APP_PASSWORD requis}
      MONGO_URI: mongodb://${MONGO_APP_USER:?MONGO_APP_USER requis}:${MONGO_APP_PASSWORD:?MONGO_APP_PASSWORD requis}@mongo:27017/${MONGO_DB:-gbekoundb_messages}?authSource=${MONGO_DB:-gbekoundb_messages}
      UPLOAD_FOLDER: /app/uploads
    # Serveur de développement avec rechargement automatique du code.
    command: python app.py
    ports:
      - "${PORT:-8880}:8880"
    volumes:
      - .:/app
      - uploads_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy

  postgres:
    image: ${POSTGRES_IMAGE:-postgres:16-alpine}
    container_name: gbekoun_dev_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${PG_DATABASE}
      POSTGRES_USER: ${PG_USER}
      POSTGRES_PASSWORD: ${PG_PASSWORD}
      PG_APP_USER: ${PG_APP_USER}
      PG_APP_PASSWORD: ${PG_APP_PASSWORD}
    ports:
      - "${PG_HOST_PORT:-5435}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/postgres/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./database/postgres/02_app_user.sh:/docker-entrypoint-initdb.d/02_app_user.sh:ro
      - ./database/postgres/app_user.sql:/opt/gbekoun/app_user.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER} -d ${PG_DATABASE}"]
      interval: 5s
      timeout: 5s
      retries: 10

  mongo:
    image: ${MONGO_IMAGE:-mongo:8.0}
    container_name: gbekoun_dev_mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DB:-gbekoundb_messages}
      MONGO_APP_USER: ${MONGO_APP_USER}
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD}
    ports:
      - "${MONGO_HOST_PORT:-27020}:27017"
    volumes:
      - mongo_data:/data/db
      - ./database/mongo/init.js:/docker-entrypoint-initdb.d/01_init.js:ro
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  mongo_data:
  uploads_data:
