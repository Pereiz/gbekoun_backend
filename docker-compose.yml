# Environnement de développement complet : API + PostgreSQL + MongoDB.
#
#   cp .env.example .env      # puis remplir les mots de passe
#   docker compose up --build
#
# Aucun secret ici : tout vient du fichier .env (non versionné).
# Ce fichier n'est PAS utilisé par Render (qui construit seulement le Dockerfile).

services:
  api:
    build: .
    container_name: gbekoun_api
    restart: unless-stopped
    env_file: .env
    environment:
      # Dans le réseau Docker, les bases sont joignables par leur nom de service.
      PG_HOST: postgres
      PG_PORT: "5432"
      MONGO_URI: mongodb://${MONGO_ROOT_USER}:${MONGO_ROOT_PASSWORD}@mongo:27017/${MONGO_DB:-gbekoundb_messages}?authSource=admin
    ports:
      - "${PORT:-8880}:8880"
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy

  postgres:
    image: postgres:16
    container_name: gbekoun_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${PG_DATABASE}
      POSTGRES_USER: ${PG_USER}
      POSTGRES_PASSWORD: ${PG_PASSWORD}
    ports:
      - "5435:5432"   # accès depuis la machine hôte : localhost:5435
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/postgres/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER} -d ${PG_DATABASE}"]
      interval: 5s
      timeout: 5s
      retries: 10

  mongo:
    image: mongo:7
    container_name: gbekoun_mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DB:-gbekoundb_messages}
    ports:
      - "27020:27017"  # accès depuis la machine hôte : localhost:27020
    volumes:
      - mongo_data:/data/db
      - ./database/mongo/init.js:/docker-entrypoint-initdb.d/01_init.js:ro
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  mongo_data:
  uploads_data:
